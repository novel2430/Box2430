[workspaces]
count = 9

[bspwm_compat]
enabled = false

[focus]
mode = "click"
active_window = "urgent"
raise_on_focus = true
focus_on_map = true
raise_on_map = true

[placement]
normal = "center"
dialog = "center"

[fullscreen]
client_policy = "fake"

[appearance]
background = "#4c566a"

[appearance.border.free]
width = 2
focused = "#eceff4"
unfocused = "#3f3f36"
urgent = "#bf616a"

[appearance.border.monocle]
width = 0
focused = "#eceff4"
unfocused = "#3f3f36"
urgent = "#bf616a"

[appearance.bar]
enabled = true
position = "top"
height = 24
padding = 0
gap = 8
font = "DejaVuSansM Nerd Font:size=12"
font_bold = "DejaVuSansM Nerd Font:style=Bold:size=12"
fg = "#eceff4"
bg = "#2d2825"
left = ["workspaces", "mode"]
center = ["clock"]
right = ["status", "tray"]

[appearance.bar.widgets.workspaces]
format = " %s "
font_style = "normal"

[appearance.bar.widgets.workspaces.empty]
fg = "#999797"
bg = "#2d2825"
font_style = "normal"
format = " %s "

[appearance.bar.widgets.workspaces.occupied]
fg = "#eceff4"
bg = "#2d2825"
font_style = "bold"
format = " %s "

[appearance.bar.widgets.workspaces.active]
fg = "#eceff4"
bg = "#5e936c"
font_style = "bold"
format = " %s "

[appearance.bar.widgets.workspaces.urgent]
fg = "#eceff4"
bg = "#bf616a"
font_style = "bold"
format = " %s "

[appearance.bar.widgets.workspaces.active_urgent]
fg = "#eceff4"
bg = "#bf616a"
font_style = "bold"
format = " %s "

[appearance.bar.widgets.mode]
format = "%s"
font_style = "normal"

[appearance.bar.widgets.mode.free]
label = "F"
format = "[%s]"
font_style = "normal"

[appearance.bar.widgets.mode.monocle]
label = "M"
format = "[%s]"
font_style = "normal"

[appearance.bar.widgets.title]
source = "title"
format = "%s"
font_style = "normal"

[appearance.bar.widgets.status]
format = "%s"
font_style = "normal"

[appearance.bar.widgets.clock]
format = "%Y-%m-%d %a %H:%M"
font_style = "normal"

[appearance.bar.widgets.tray]
bg = "#5e936c"

[appearance.tabs]
enabled = true
position = "bottom"
height = 20
padding = 8
font = "DejaVuSansM Nerd Font:size=10"
font_bold = "DejaVuSansM Nerd Font:style=Bold:size=10"
source = "class"
format = "%s"
fg = "#eceff4"
bg = "#2d2825"
font_style = "normal"

[appearance.tabs.inactive]
fg = "#eceff4"
bg = "#2d2825"
font_style = "normal"
format = "%s"

[appearance.tabs.active]
fg = "#eceff4"
bg = "#5e936c"
font_style = "bold"
format = "%s"

[appearance.tabs.urgent]
fg = "#eceff4"
bg = "#bf616a"
font_style = "bold"
format = "%s"

[appearance.snap_preview]
color = "#eceff4"
width = 2

[snap]
enabled = true
edge_zone = 16
side_ratio = 0.5
corner_width_ratio = 0.5
corner_height_ratio = 0.5
preview = true

[bindings]
inherit_defaults = true

[bindings.keys]
"Super+m" = "mode monocle toggle"
"Super+j" = "focus next"
"Super+k" = "focus prev"
"Alt+Tab" = "focus next"

"Super+Left" = "snap left"
"Super+Right" = "snap right"
"Super+Up" = "maximize toggle"
"Super+f" = "fullscreen toggle"

"Super+Shift+e" = "wm quit"
"Super+Shift+r" = "wm restart"

"Alt+1" = "tab focus 1"
"Alt+2" = "tab focus 2"
"Alt+3" = "tab focus 3"
"Alt+4" = "tab focus 4"
"Alt+5" = "tab focus 5"

"Super+o" = "monitor next"

"Super+Ctrl+Left" = "workspace prev"
"Super+Ctrl+Right" = "workspace next"
"Super+Ctrl+k" = "workspace prev"
"Super+Ctrl+j" = "workspace next"
"Super+Return" = "spawn wezterm"
"Super+d" = "spawn rofi -show drun"

[bindings.mouse]
"Super+Button1" = "mouse move-window"
"Super+Button3" = "mouse resize-window"

[bindings.tabbar]
"Button1" = "tab focus"
"Button2" = "tab close"
"Button3" = "none"
"WheelUp" = "focus prev"
"WheelDown" = "focus next"

[bindings.workspacebar]
"Button1" = "workspace activate"
"Button2" = "none"
"Button3" = "none"
"WheelUp" = "workspace prev"
"WheelDown" = "workspace next"

[[rules]]
class = "Firefox"
fullscreen_policy = "fake"

[[rules]]
class = "mpv"
fullscreen_policy = "allow"
