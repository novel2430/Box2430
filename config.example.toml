[workspaces]
count = 9

[bspwm_compat]
enabled = false

[focus]
mode = "click"
active_window = "urgent"
raise_on_focus = false
focus_on_map = true
raise_on_map = true

[placement]
normal = "center"
dialog = "center"

[fullscreen]
client_policy = "fake"

[appearance]
background = "#000000"

[appearance.border.free]
width = 2
focused = "#89b4fa"
unfocused = "#45475a"
urgent = "#f38ba8"

[appearance.border.monocle]
width = 0
focused = "#89b4fa"
unfocused = "#45475a"
urgent = "#f38ba8"

[appearance.bar]
enabled = true
position = "top"
height = 24
padding = 8
gap = 8
font = "monospace:size=10"
font_bold = "monospace:style=Bold:size=10"
fg = "#aaaaaa"
bg = "#222222"
left = ["workspaces", "mode"]
center = ["title"]
right = ["status", "clock", "tray"]

[appearance.bar.widgets.workspaces]
format = " %s "
font_style = "normal"

[appearance.bar.widgets.workspaces.empty]
fg = "#666666"
bg = "#222222"
font_style = "normal"
format = " %s "

[appearance.bar.widgets.workspaces.occupied]
fg = "#aaaaaa"
bg = "#222222"
font_style = "normal"
format = " %s "

[appearance.bar.widgets.workspaces.active]
fg = "#ffffff"
bg = "#3b4252"
font_style = "bold"
format = "[ %s ]"

[appearance.bar.widgets.workspaces.urgent]
fg = "#ffffff"
bg = "#bf616a"
font_style = "bold"
format = "! %s !"

[appearance.bar.widgets.workspaces.active_urgent]
fg = "#ffffff"
bg = "#bf616a"
font_style = "bold"
format = "[! %s !]"

[appearance.bar.widgets.mode]
format = "%s"
font_style = "normal"

[appearance.bar.widgets.mode.free]
label = "F"
format = "[ %s ]"
font_style = "normal"

[appearance.bar.widgets.mode.monocle]
label = "M"
format = "[ %s ]"
font_style = "bold"

[appearance.bar.widgets.title]
source = "title"
format = "%s"
font_style = "normal"

[appearance.bar.widgets.status]
format = "%s"
font_style = "normal"

[appearance.bar.widgets.clock]
format = "%H:%M"
font_style = "normal"

[appearance.bar.widgets.tray]
bg = "#222222"

[appearance.tabs]
enabled = true
position = "top"
height = 24
padding = 8
font = "monospace:size=10"
font_bold = "monospace:style=Bold:size=10"
source = "title"
format = "%s"
fg = "#aaaaaa"
bg = "#222222"
font_style = "normal"

[appearance.tabs.inactive]
fg = "#aaaaaa"
bg = "#222222"
font_style = "normal"
format = "%s"

[appearance.tabs.active]
fg = "#ffffff"
bg = "#3b4252"
font_style = "bold"
format = "%s"

[appearance.tabs.urgent]
fg = "#ffffff"
bg = "#bf616a"
font_style = "bold"
format = "%s"

[appearance.snap_preview]
color = "#89b4fa"
width = 2

[snap]
enabled = true
edge_zone = 16
side_ratio = 0.5
corner_width_ratio = 0.5
corner_height_ratio = 0.5
preview = true

[bindings]
inherit_defaults = true

[bindings.keys]
"Super+m" = "mode monocle toggle"
"Super+j" = "focus next"
"Super+k" = "focus prev"
"Alt+Tab" = "focus next"
"Super+Left" = "snap left"
"Super+Right" = "snap right"
"Super+Up" = "maximize toggle"
"Super+f" = "fullscreen toggle"
"Super+Ctrl+Left" = "monitor prev"
"Super+Ctrl+Right" = "monitor next"

[bindings.mouse]
"Super+Button1" = "mouse move-window"
"Super+Button3" = "mouse resize-window"

[bindings.tabbar]
"Button1" = "tab focus"
"Button2" = "tab close"
"Button3" = "none"
"WheelUp" = "focus prev"
"WheelDown" = "focus next"

[bindings.workspacebar]
"Button1" = "workspace activate"
"Button2" = "none"
"Button3" = "none"
"WheelUp" = "none"
"WheelDown" = "none"

[[rules]]
class = "Firefox"
fullscreen_policy = "fake"

[[rules]]
class = "mpv"
fullscreen_policy = "allow"
