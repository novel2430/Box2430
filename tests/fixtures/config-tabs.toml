[appearance.tabs]
enabled = true
height = 31
padding = 12
font = "monospace:size=10"
font_bold = "monospace:style=Bold:size=10"
source = "class"
format = "[%s]"
fg = "#aaaaaa"
bg = "#182028"
font_style = "normal"

[appearance.tabs.active]
fg = "#ffffff"
bg = "#315577"
font_style = "bold"

[appearance.tabs.inactive]
fg = "#aaaaaa"
bg = "#182028"
font_style = "normal"

[appearance.tabs.urgent]
fg = "#ffffff"
bg = "#aa2233"
font_style = "bold"

[bindings]
inherit_defaults = true

[bindings.keys]
"Super+m" = "mode monocle toggle"

[bindings.tabbar]
"Button1" = "tab focus"
"Button2" = "tab close"
"Button3" = "none"
"WheelUp" = "focus prev"
"WheelDown" = "focus next"
