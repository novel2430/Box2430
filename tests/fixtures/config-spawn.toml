[bindings]
inherit_defaults = false

[bindings.keys]
"Super+s" = "spawn x11-sigchld-client"
"Super+e" = "spawn box2430-command-that-does-not-exist"
"Super+t" = "spawn xterm -title SpawnedXterm"
"Super+h" = "spawn-shell 'printf shell-ok > \"$BOX2430_SPAWN_SHELL_TEST_FILE\"'"
"Super+x" = "window close"
